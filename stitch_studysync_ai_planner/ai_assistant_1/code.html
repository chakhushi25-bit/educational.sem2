  </head><body class="bg-surface-container-low font-headline-sm min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-container-padding flex items-center justify-between"><div class="flex items-center gap-xs"><img alt="StudySync AI Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdeQwalKkM17c8RVDzsj5bFm4ZZaHlTcKgsMpOTIeqQaGr0ujFB_9lockl4xeR-4g_xLyj9KOFIBYnXDOpGiVOPOpDJXq4ROSQ9jIBNOTZNKA1TNQbNiWYZ-iwh9FA8ACz0ZcrshFB4rA-8x1cRiWhyKLfB-_XIiw7dlrWHYlqjmL9m_9sz_4qEKaI_uR0xwNqnK96cMEPempmEzuzCbl-bE3CidPNuhGwKfCPDkIGHqrUvmGqc6xP"/><span class="text-on-surface font-headline-sm text-headline-sm tracking-tight">StudySync AI</span></div><div class="flex items-center gap-xs"><button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-on-surface-variant">notifications</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="pt-16 pb-xxl bg-surface-container-low min-h-screen"><div class="flex flex-col w-full h-[calc(100vh-8rem)]">
<!-- Header Area -->
<div class="px-container-padding py-6 flex flex-col gap-2">
<h1 class="text-display-lg font-display-lg text-on-surface">StudySync AI Assistant</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Your personal study buddy.</p>
</div>
<!-- Quick Prompts Area -->
<div class="px-container-padding mb-6">
<h2 class="text-label-bold font-label-bold text-on-surface-variant uppercase tracking-wider mb-4">Quick Actions</h2>
<div class="flex overflow-x-auto snap-x snap-mandatory hide-scrollbar gap-sm pb-2">
<button class="snap-start shrink-0 w-48 h-24 bg-surface-container rounded-xl p-4 flex flex-col justify-between items-start text-left shadow-sm active:scale-95 transition-transform" onclick="document.getElementById('chat-input').value = 'Explain this simply'; document.getElementById('chat-input').focus();">
<span class="material-symbols-outlined text-primary">lightbulb</span>
<span class="text-body-md font-body-md text-on-surface font-medium">Explain this simply</span>
</button>
<button class="snap-start shrink-0 w-48 h-24 bg-surface-container rounded-xl p-4 flex flex-col justify-between items-start text-left shadow-sm active:scale-95 transition-transform" onclick="document.getElementById('chat-input').value = 'Create 10 MCQs'; document.getElementById('chat-input').focus();">
<span class="material-symbols-outlined text-secondary">quiz</span>
<span class="text-body-md font-body-md text-on-surface font-medium">Create 10 MCQs</span>
</button>
<button class="snap-start shrink-0 w-48 h-24 bg-surface-container rounded-xl p-4 flex flex-col justify-between items-start text-left shadow-sm active:scale-95 transition-transform" onclick="document.getElementById('chat-input').value = 'Help me revise'; document.getElementById('chat-input').focus();">
<span class="material-symbols-outlined text-tertiary">edit_document</span>
<span class="text-body-md font-body-md text-on-surface font-medium">Help me revise</span>
</button>
</div>
</div>
<!-- Chat Area -->
<div class="flex-1 flex flex-col px-container-padding pb-4 overflow-y-auto" id="chat-messages">
<!-- Empty State / Welcome Message -->
<div class="flex flex-col items-center justify-center h-full text-center opacity-70">
<div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[40px] text-primary">smart_toy</span>
</div>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-[250px]">What would you like to learn today?</p>
</div>
<!-- Messages will be appended here via JS -->
</div>
<!-- Input Area -->
<div class="px-container-padding py-4 bg-surface/80 backdrop-blur-md">
<form class="flex items-end gap-sm" onsubmit="event.preventDefault(); sendMessage();">
<div class="flex-1 bg-surface-container-high rounded-3xl p-1 flex items-center shadow-inner relative">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors" id="attach-btn" type="button">
<span class="material-symbols-outlined">add</span>
</button>
<textarea class="flex-1 bg-transparent border-none focus:outline-none text-body-lg font-body-lg text-on-surface resize-none py-3 px-2 max-h-32" id="chat-input" placeholder="Message StudySync AI..." rows="1"></textarea>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md transform transition-transform active:scale-90" id="send-btn" type="submit">
<span class="material-symbols-outlined text-[20px]">arrow_upward</span>
</button>
</div>
</form>
</div>
</div>
<style>
    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
</style>
<script>
    // Auto-resize textarea
    const tx = document.getElementById('chat-input');
    tx.setAttribute('style', 'height:' + (tx.scrollHeight) + 'px;overflow-y:hidden;');
    tx.addEventListener("input", OnInput, false);

    function OnInput() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        if(this.value.trim() === '') {
            this.style.height = '48px'; // Reset to default height
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        const chatContainer = document.getElementById('chat-messages');
        
        // Remove empty state if present
        if (chatContainer.children.length === 1 && chatContainer.children[0].classList.contains('opacity-70')) {
             chatContainer.innerHTML = '';
        }

        // Add user message
        const userMsg = document.createElement('div');
        userMsg.className = 'self-end max-w-[85%] bg-primary text-on-primary rounded-2xl rounded-tr-sm px-4 py-3 mb-4 shadow-sm transform scale-95 opacity-0 transition-all duration-300';
        userMsg.innerHTML = `<p class="text-body-lg font-body-lg">${message}</p>`;
        chatContainer.appendChild(userMsg);

        // Animate user message
        requestAnimationFrame(() => {
            userMsg.classList.remove('scale-95', 'opacity-0');
        });

        // Reset input
        input.value = '';
        input.style.height = '48px';
        
        // Scroll to bottom
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Simulate AI typing
        setTimeout(() => {
            const aiLoading = document.createElement('div');
            aiLoading.className = 'self-start max-w-[85%] bg-surface-container rounded-2xl rounded-tl-sm px-4 py-3 mb-4 shadow-sm flex items-center gap-1';
            aiLoading.id = 'ai-loading';
            aiLoading.innerHTML = `
                <div class="w-2 h-2 rounded-full bg-primary/50 animate-bounce" style="animation-delay: 0s"></div>
                <div class="w-2 h-2 rounded-full bg-primary/50 animate-bounce" style="animation-delay: 0.15s"></div>
                <div class="w-2 h-2 rounded-full bg-primary/50 animate-bounce" style="animation-delay: 0.3s"></div>
            `;
            chatContainer.appendChild(aiLoading);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Simulate AI response
            setTimeout(() => {
                const loadingEl = document.getElementById('ai-loading');
                if(loadingEl) loadingEl.remove();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'self-start max-w-[85%] bg-surface-container text-on-surface rounded-2xl rounded-tl-sm px-4 py-3 mb-4 shadow-sm transform scale-95 opacity-0 transition-all duration-300';
                
                let responseText = "I can certainly help with that! Let's break it down step-by-step.";
                if(message.toLowerCase().includes('mcq')) {
                    responseText = "Generating 10 multiple choice questions based on your recent study material... Here is the first one:";
                } else if (message.toLowerCase().includes('revise')) {
                    responseText = "Great! Let's review the key concepts from your Biology notes.";
                }

                aiMsg.innerHTML = `<p class="text-body-lg font-body-lg">${responseText}</p>`;
                chatContainer.appendChild(aiMsg);

                 // Animate AI message
                requestAnimationFrame(() => {
                    aiMsg.classList.remove('scale-95', 'opacity-0');
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1500);

        }, 500);
    }
    
    // Bottom Nav Active State Setup - assuming shell handles routing, just visually highlighting here
    document.addEventListener('DOMContentLoaded', () => {
         const navLinks = document.querySelectorAll('nav a');
         navLinks.forEach(link => {
             if(link.getAttribute('data-path') === 'ai-chat') {
                 link.classList.add('text-primary');
                 link.classList.remove('text-on-surface-variant');
             } else {
                 link.classList.remove('text-primary');
                 link.classList.add('text-on-surface-variant');
             }
         });
    });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary"><div class="flex justify-between items-center h-16 px-base"><a class="flex-1 flex flex-col items-center justify-center gap-base text-on-surface-variant hover:text-primary transition-all" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="text-label-md font-label-md">Home</span></a><a class="flex-1 flex flex-col items-center justify-center gap-base text-on-surface-variant hover:text-primary transition-all" data-path="planner" href="#"><span class="material-symbols-outlined">event_note</span><span class="text-label-md font-label-md">Planner</span></a><a aria-current="page" class="flex-1 flex flex-col items-center justify-center gap-base transition-all text-primary" data-path="ai-chat" href="#"><div class="-mt-8 w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-lg"><span class="material-symbols-outlined text-on-primary">smart_toy</span></div><span class="text-label-md font-label-md">AI Chat</span></a><a class="flex-1 flex flex-col items-center justify-center gap-base text-on-surface-variant hover:text-primary transition-all" data-path="history" href="#"><span class="material-symbols-outlined">history</span><span class="text-label-md font-label-md">History</span></a><a class="flex-1 flex flex-col items-center justify-center gap-base text-on-surface-variant hover:text-primary transition-all" data-path="profile" href="#"><span class="material-symbols-outlined">person</span><span class="text-label-md font-label-md">Profile</span></a></div></nav></body></html>
